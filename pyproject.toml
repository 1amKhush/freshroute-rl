[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshroute-rl"
version = "0.1.0"
description = "Learn staleness-aware read routing across simulated database replicas."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rl = ["gymnasium>=1.1,<2", "numpy>=2,<3", "stable-baselines3>=2.6,<3", "torch>=2.6,<3"]

[project.scripts]
freshroute = "freshroute.__main__:main"

[tool.setuptools.packages.find]
include = ["freshroute*"]
